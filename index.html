<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol ESP32 Buzzer IoT</title>
    <!-- Memuat library MQTT.js via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .btn-on { background-color: #28a745; }
        .btn-off { background-color: #dc3545; }
        button:hover { opacity: 0.9; }
        #status {
            font-weight: bold;
            margin-bottom: 20px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Kontrol Buzzer ESP32</h2>
        <p id="status">Status: Menghubungkan ke broker...</p>
        
        <!-- Tombol Kontrol -->
        <button class="btn-on" onclick="kirimPerintah('ON')">NYALAKAN BUZZER</button>
        <br>
        <button class="btn-off" onclick="kirimPerintah('OFF')">MATIKAN BUZZER</button>
    </div>

    <script>
        // Menggunakan broker publik EMQX dengan jalur WebSocket Secure (WSS)
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        const topic = 'esp32/luthfi/buzzer'; 

        const client = mqtt.connect(brokerUrl, options);

        client.on('connect', function () {
            document.getElementById('status').innerText = 'Status: Terhubung ke Broker (Siap Mengontrol)';
            document.getElementById('status').style.color = 'green';
            console.log('Terhubung ke MQTT Broker');
        });

        client.on('error', function (error) {
            document.getElementById('status').innerText = 'Status: Gagal Terhubung!';
            document.getElementById('status').style.color = 'red';
            console.log('Koneksi gagal: ', error);
        });

        // Fungsi untuk mengirim pesan saat tombol diklik
        function kirimPerintah(perintah) {
            client.publish(topic, perintah, function (err) {
                if (!err) {
                    console.log('Perintah terkirim: ' + perintah);
                } else {
                    console.log('Gagal mengirim perintah');
                }
            });
        }
    </script>

</body>
</html>
